name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:   # "Run workflow" button in the Actions tab

jobs:
  core:
    name: Core library + unit tests + m2m-cli (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DM2M_BUILD_PLUGIN=OFF -DM2M_BUILD_TESTS=ON -DM2M_BUILD_TOOLS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: m2m-cli smoke check (level trigger)
        run: build/tools/m2m-cli/m2m-cli eval --mode trigger --scenarios level_bursts --report build/m2m-eval-trigger.json

      # ---- Metric regression gates (PLAN.md §9, Phase 2) -------------------
      # (ctest above runs the same gates; these steps also keep the reports.)
      # A metric past its stored gate makes m2m-cli exit 4 and fails CI.
      # Update a baseline after an intended change with
      #   m2m-cli eval --mode melody --baseline tests/baselines/melody.json --write-baseline tests/baselines/melody.json
      - name: Melody regression gate
        run: build/tools/m2m-cli/m2m-cli eval --mode melody --scenarios all-melody --baseline tests/baselines/melody.json --report build/m2m-eval-melody.json
      - name: Melody regression gate (Note lock)
        run: build/tools/m2m-cli/m2m-cli eval --mode melody --scenarios all-melody --set follow=lock --tolerance-ms 100 --baseline tests/baselines/melody_lock.json --report build/m2m-eval-melody-lock.json
      - name: Beatbox regression gate
        run: build/tools/m2m-cli/m2m-cli eval --mode beatbox --scenarios all-beatbox --baseline tests/baselines/beatbox.json --report build/m2m-eval-beatbox.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2m-eval-reports
          path: build/m2m-eval-*.json

  core-clang:
    name: Core library + gates with clang (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja + clang
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DM2M_BUILD_PLUGIN=OFF -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build
      - name: Test (unit tests, real-time safety, regression gates)
        run: ctest --test-dir build --output-on-failure

  plugin-linux:
    name: Plugin build + pluginval (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Hosting smoke test
        run: |
          xvfb-run -a build/tools/plugin-smoke-test/m2m_plugin_smoke_test_artefacts/Release/m2m_plugin_smoke_test \
            build/plugin/MICtoMIDI_artefacts/Release/VST3/MICtoMIDI.vst3
      - name: pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process \
            --validate build/plugin/MICtoMIDI_artefacts/Release/VST3/MICtoMIDI.vst3

  plugin-macos:
    name: Plugin build + pluginval (macOS arm64)
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja || true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Hosting smoke test
        run: |
          build/tools/plugin-smoke-test/m2m_plugin_smoke_test_artefacts/Release/m2m_plugin_smoke_test \
            build/plugin/MICtoMIDI_artefacts/Release/VST3/MICtoMIDI.vst3
      - name: pluginval (VST3 + AU)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          $PV --strictness-level 10 --validate-in-process --validate build/plugin/MICtoMIDI_artefacts/Release/VST3/MICtoMIDI.vst3
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/plugin/MICtoMIDI_artefacts/Release/AU/MICtoMIDI.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          $PV --strictness-level 10 --validate-in-process --validate ~/Library/Audio/Plug-Ins/Components/MICtoMIDI.component
      - name: Package unsigned build
        run: |
          cd build/plugin/MICtoMIDI_artefacts/Release
          zip -qry "$GITHUB_WORKSPACE/MICtoMIDI-macOS-arm64-unsigned.zip" VST3 AU Standalone
      - uses: actions/upload-artifact@v4
        with:
          name: MICtoMIDI-macOS-arm64-unsigned
          path: MICtoMIDI-macOS-arm64-unsigned.zip
